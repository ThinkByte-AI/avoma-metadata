name: meeting-intel

x-backend-common: &backend-common
  build: ./backend
  restart: unless-stopped
  env_file:
    # Root .env of the archive repo holds AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (optional).
    - path: ../.env
      required: false
    - path: .env
      required: true
  environment:
    DATABASE_URL: postgresql+psycopg://mi:${POSTGRES_PASSWORD:-mi}@db:5432/meeting_intel
    METADATA_DIR: /data/metadata
  volumes:
    - ../data/metadata:/data/metadata:ro

services:
  db:
    image: pgvector/pgvector@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8  # pgvector 0.8.7 / Postgres 17.11 (iterative HNSW scans need >= 0.8)
    restart: unless-stopped
    environment:
      POSTGRES_USER: mi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi}
      POSTGRES_DB: meeting_intel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mi -d meeting_intel"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend-common
    # Runs migrations before serving; it only reports healthy once they are done.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend-common
    command: python -m app.worker
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
